# Bench coverage for this contest.
#
# Each table declares only maxgen, so --bench times the largest input. No
# reference solution is registered, so --all reports each of these as
# UNSUPPORTED ("problem has no reference") and counts it as a pass.
#
# The spec is a built-in generator kind plus its arguments. See
# bench/src/genlib/kinds.go for the byte shape each kind writes.

# A -- two lines: a word and a mask
[A]
maxgen = "letters %S 12"
hash = { "61/A.exe" = "368408d624da53ef62a47970733c0eb8b6b8dd2803e7d8ee9661390971d45bc9" }
