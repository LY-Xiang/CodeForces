# Bench coverage for this contest.
#
# Each table declares only maxgen, so --bench times the largest input. No
# reference solution is registered, so --all reports each of these as
# UNSUPPORTED ("problem has no reference") and counts it as a pass.
#
# The spec is a built-in generator kind plus its arguments. See
# bench/src/genlib/kinds.go for the byte shape each kind writes.

# A -- t then t (n, char, string)
[A]
maxgen = "oneshot %S 100 1 100"
hash = { "2267/A.exe" = "da8fc43a2fc5275ba867d45d54edf2d8bdfcaeb7df19acbf45a0eab6047eea67" }

# B -- t then t (n + n values)
[B]
maxgen = "oneshot %S 100 1 100"
hash = { "2267/B.exe" = "633dafe811fcf2655dfaa0395189c7cfed2ff0c1f4cca5f19d1771c22edf7aca" }

# C -- t then n x and n values
[C]
maxgen = "t2 %S 100 5 1 12"
hash = { "2267/C.exe" = "cee2e4e2c16073bdd4194acff619de4566253add0ee793ad5d2fc934dfae1459" }

# D -- t then t (n + permutation)
[D]
maxgen = "perm %S 100 200"
hash = { "2267/D.exe" = "acace2885dfaad4bbb7cc1b68f34450ee391a226c8bbf125b01d12a5112dccc5" }

