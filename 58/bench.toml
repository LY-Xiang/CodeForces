# Bench coverage for this contest.
#
# Each table declares only maxgen, so --bench times the largest input
# and --all has nothing to check: no reference solution is registered
# for these problems.
#
# The spec is a built-in generator kind plus its arguments. See
# bench/src/genlib/kinds.go for the byte shape each kind writes.

# A -- one word: can "hello" be picked out
[A]
maxgen = "letters %S 25"
